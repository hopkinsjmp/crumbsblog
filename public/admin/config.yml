backend:
  name: github
  repo: hopkinsjmp/crumbsblog
  branch: main
  base_url: https://wandering-sea-62bc.hopkinsjmp.workers.dev

# All content commits directly to main - no draft branches
# Publishing controlled by date field in frontmatter

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: Blog Posts
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}} — {{date}}"
    view_filters:
      - label: All Posts
        field: date
        pattern: ''
      - label: Published (2026 & Earlier)
        field: date
        pattern: '^202[0-6]'
      - label: Future/Draft (2027+)
        field: date
        pattern: '^20(2[7-9]|[3-9]\d|99)'
      - label: Missing Date
        field: date
        pattern: '^$'
    sortable_fields: ['date', 'title']
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Degree Stage, name: degreeStage, widget: string, required: false }
      - { label: Subject, name: subject, widget: string, required: false }
      - label: Frame of Mind
        name: frameOfMind
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Emoji, name: emoji, widget: string, required: false }
          - { label: Description, name: description, widget: string, required: false }
      - label: Hero Image
        name: heroImg
        widget: image
        required: false
        media_folder: /public/uploads/posts
        public_folder: /uploads/posts
      - { label: Hero Image Alt Text, name: heroImgAlt, widget: string, required: false, hint: "Describe what's in the image for accessibility and SEO" }
      - { label: Video URL (YouTube), name: videoUrl, widget: string, required: false }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Hands On Time, name: handsOnTime, widget: string, required: false }
      - { label: Hands Off Time, name: handOffTime, widget: string, required: false }
      - { label: Servings, name: servings, widget: number, required: false }
      - { label: Dietary Notes, name: dietaryNotes, widget: string, required: false }
      - { label: Recipe Cuisine, name: recipeCuisine, widget: string, required: false, hint: "e.g., British, Asian, Mediterranean" }
      - { label: Recipe Category, name: recipeCategory, widget: string, required: false, hint: "e.g., Dessert, Main Course, Appetizer" }
      - { label: Ingredients, name: ingredients, widget: text, required: false }
      - { label: Method, name: method, widget: text, required: false }
      - { label: Storage, name: storage, widget: string, required: false }
      - label: Author
        name: author
        widget: relation
        collection: authors
        search_fields: [name]
        value_field: "{{fields.name}}"
        display_fields: [name]
        required: false
      - { label: Date, name: date, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ", picker_utc: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        allow_add: true
        field:
          label: Tag
          widget: string
      - { label: Body, name: body, widget: markdown }

  - name: authors
    label: Authors
    folder: content/authors
    create: true
    slug: "{{fields.name}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Avatar, name: avatar, widget: image, required: false }

  - name: tags
    label: Tags
    folder: content/tags
    create: true
    slug: "{{fields.name}}"
    extension: mdx
    format: frontmatter
    fields:
      - { label: Name, name: name, widget: string }
